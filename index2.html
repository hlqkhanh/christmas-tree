<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Swaying Logo</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        #ui-layer { position: absolute; bottom: 30px; width: 100%; text-align: center; pointer-events: none; z-index: 100; }
        .badge {
            display: inline-block; background: rgba(0, 0, 0, 0.7); border: 2px solid #FFD700; color: #FFD700;
            padding: 10px 25px; border-radius: 50px; font-size: 18px; font-weight: bold; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            position: fixed; top: 40px; left: 50%; transform: translateX(-50%); z-index: 100; white-space: nowrap;
        }

        .bottom-controls {
            position: fixed; bottom: 0; left: 0; width: 100%; display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end; padding-bottom: calc(20px + env(safe-area-inset-bottom));
            z-index: 100; pointer-events: none;
        }

        .guide { color: #ccc; font-size: 13px; margin-bottom: -10px; text-shadow: 0 2px 4px black; padding: 8px 15px; }

        button {
            pointer-events: auto; cursor: pointer; background: linear-gradient(to bottom, #D32F2F, #8B0000);
            color: #FFF; border: 2px solid #FFD700; padding: 15px 50px; border-radius: 30px;
            font-weight: 800; font-size: 16px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            animation: pulse 1.5s infinite; margin-bottom: 15px; transition: transform 0.2s;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #camera-preview {
            position: absolute; top: 15px; right: 15px; width: 120px; height: 90px;
            border: 2px solid rgba(255, 0, 0, 0.5); transform: scaleX(-1); opacity: 0.6; border-radius: 8px;
        }
        .input_video { display: none; }
    </style>
</head>

<body>
    <div id="ui-layer">
        <div id="status" class="badge">🎄 GIÁNG SINH AN LÀNH 🎄</div>
        <div class="bottom-controls">
            <button id="btnStart" onclick="startSystem()">BẮT ĐẦU</button>
            <div class="guide" id="guideText" style="visibility: hidden;">
                <span>✊ <b>Nắm:</b> Thu</span> | <span>🖐 <b>Xòe:</b> Bung</span> | <span>👌 <b>Pinch:</b> Xem ảnh</span>
            </div>
        </div>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video"></video>
    <canvas id="camera-preview" style="visibility: hidden;"></canvas>

    <script>
        // =========================================================================
        // 1. CẤU HÌNH
        // =========================================================================
        const LOGO_PATH = './logo.png'; 
        const PHOTO_LIST = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg']; 
        const MUSIC_URL = "./audio.mp3";

        const CONFIG = {
            particleCount: 10000, 
            giftCount: 0,      
            explodeRadius: 80,
            photoOrbitRadius: 35
        };

        // =========================================================================
        // 2. HỆ THỐNG XỬ LÝ
        // =========================================================================
        let scene, camera, renderer;
        let mainParticleGroup, giftGroup;
        let photoMeshes = [];
        let logoData = []; 
        let state = 'SHAPE'; 
        let selectedIndex = 0;
        let handX = 0.5;
        let bgMusic = new Audio(MUSIC_URL); bgMusic.loop = true;

        // --- Texture ---
        function createCustomTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const cx = 32, cy = 32;

            if (type === 'white_glow') {
                const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
                grd.addColorStop(0, 'rgba(255,255,255,1)');
                grd.addColorStop(0.4, 'rgba(255,255,255,0.8)');
                grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0, 0, 64, 64);
            } else if (type === 'gift') {
                ctx.fillStyle = '#D32F2F'; ctx.fillRect(10, 10, 44, 44);
                ctx.fillStyle = '#FFD700'; ctx.fillRect(28, 10, 8, 44); ctx.fillRect(10, 28, 44, 8);
            }
            return new THREE.CanvasTexture(canvas);
        }
        
        const whiteTexture = createCustomTexture('white_glow');
        const giftTexture = createCustomTexture('gift');
        const loader = new THREE.TextureLoader();
        const photoTextures = PHOTO_LIST.map(url => loader.load(url));

        // --- Hàm quét màu và vị trí Logo ---
        function loadLogoAndInit(callback) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = LOGO_PATH;
            
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 300; 
                canvas.width = size; canvas.height = size;
                
                const aspect = img.width / img.height;
                let w = size, h = size;
                if (aspect > 1) h = size / aspect; else w = size * aspect;
                ctx.drawImage(img, (size-w)/2, (size-h)/2, w, h);
                
                const data = ctx.getImageData(0, 0, size, size).data;
                logoData = [];
                for(let i=0; i < size*size; i++) {
                    const r = data[i*4];
                    const g = data[i*4+1];
                    const b = data[i*4+2];
                    const a = data[i*4+3];
                    
                    if(a > 100) { 
                        logoData.push({
                            x: (i % size) - size/2,
                            y: size/2 - Math.floor(i / size),
                            color: new THREE.Color(`rgb(${r},${g},${b})`)
                        });
                    }
                }
                if(callback) callback();
            };

            img.onerror = () => {
                alert("Lỗi tải Logo! Hãy đảm bảo chạy trên Live Server.");
                logoData = [];
                if(callback) callback();
            };
        }

        // --- 3D Scene ---
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x050505, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            mainParticleGroup = createColorParticleSystem(CONFIG.particleCount, 2.0);
            giftGroup = createGiftSystem(CONFIG.giftCount, 2.5);

            createPhotos();
            animate();
        }

        function createColorParticleSystem(count, size) {
            const pPositions = [];
            const pColors = []; 
            const pShapeTargets = [];   
            const pExplodeTargets = []; 

            for (let i = 0; i < count; i++) {
                let tx = 0, ty = 0, tz = 0;
                let color = new THREE.Color(0xffffff);

                if (logoData.length > 0) {
                    const randomIndex = Math.floor(Math.random() * logoData.length);
                    const ptData = logoData[randomIndex]; 
                    
                    const scale = 0.4; 
                    tx = ptData.x * scale;
                    ty = ptData.y * scale + 5;
                    tz = (Math.random() - 0.5) * 15;
                    color = ptData.color; 
                } else {
                    tx = (Math.random()-0.5)*50; ty = (Math.random()-0.5)*50;
                    color.setHSL(Math.random(), 1.0, 0.5); 
                }
                pShapeTargets.push(tx, ty, tz);
                pColors.push(color.r, color.g, color.b); 

                const u = Math.random(); const v = Math.random();
                const phi = Math.acos(2 * v - 1); const lam = 2 * Math.PI * u;
                const rad = CONFIG.explodeRadius * Math.cbrt(Math.random());
                pExplodeTargets.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                pPositions.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
            geo.setAttribute('color', new THREE.Float32BufferAttribute(pColors, 3));
            geo.userData = { shape: pShapeTargets, explode: pExplodeTargets };

            const mat = new THREE.PointsMaterial({
                size: size,
                map: whiteTexture, 
                vertexColors: true, 
                transparent: true, opacity: 0.9,
                blending: THREE.AdditiveBlending, depthWrite: false
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            return points;
        }

        function createGiftSystem(count, size) {
             const pPositions = []; const pShapeTargets = []; const pExplodeTargets = [];
             for(let i=0; i<count; i++) {
                if(logoData.length > 0) {
                    const pt = logoData[Math.floor(Math.random()*logoData.length)];
                    pShapeTargets.push(pt.x*0.4, pt.y*0.4+5, (Math.random()-0.5)*20);
                } else { pShapeTargets.push(0,0,0); }
                
                const u=Math.random(), v=Math.random();
                const phi=Math.acos(2*v-1), lam=2*Math.PI*u;
                const rad = CONFIG.explodeRadius * 1.2; 
                pExplodeTargets.push(rad*Math.sin(phi)*Math.cos(lam), rad*Math.sin(phi)*Math.sin(lam), rad*Math.cos(phi));
                pPositions.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
             }
             const geo = new THREE.BufferGeometry();
             geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
             geo.userData = { shape: pShapeTargets, explode: pExplodeTargets };
             const mat = new THREE.PointsMaterial({ size: size, map: giftTexture, transparent: true, blending: THREE.NormalBlending, depthWrite: false });
             const points = new THREE.Points(geo, mat);
             scene.add(points);
             return points;
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(8, 8);
            for (let i = 0; i < photoTextures.length; i++) {
                const mat = new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide });
                const mesh = new THREE.Mesh(geo, mat);
                const border = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ color: 0xFFD700 }));
                border.position.z = -0.1; mesh.add(border);
                mesh.visible = false; mesh.scale.set(0,0,0);
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const speed = 0.07; 
            const handRotY = (handX - 0.5) * 2.5;

            [mainParticleGroup, giftGroup].forEach(group => {
                const positions = group.geometry.attributes.position.array;
                const targetKey = (state === 'SHAPE') ? 'shape' : 'explode';
                const targets = group.geometry.userData[targetKey];

                for (let i = 0; i < positions.length; i++) {
                    positions[i] += (targets[i] - positions[i]) * speed;
                }
                group.geometry.attributes.position.needsUpdate = true;
                
                if (state === 'SHAPE') {
                    // --- ĐÃ SỬA: LẮC QUA LẮC LẠI 160 ĐỘ ---
                    // 1.4 Radian ~ 80 độ mỗi bên (Tổng 160 độ)
                    // time * 0.5 để lắc chậm rãi
                    group.rotation.y = Math.sin(time * 1) * 0.7; 
                } else {
                    // Khi xòe tay, xoay theo tay người dùng
                    group.rotation.y += (handRotY - group.rotation.y) * 0.08;
                }
            });

            if (state === 'SHAPE') {
                photoMeshes.forEach(m => { m.visible = false; m.scale.set(0,0,0); });
            } else if (state === 'EXPLODE') {
                const count = photoMeshes.length;
                const angleStep = (Math.PI * 2) / count;
                let maxZ = -999; let bestIdx = 0;
                photoMeshes.forEach((mesh, i) => {
                    mesh.visible = true;
                    const angle = mainParticleGroup.rotation.y + i * angleStep;
                    mesh.position.lerp(new THREE.Vector3(Math.sin(angle)*CONFIG.photoOrbitRadius, Math.sin(time+i)*2, Math.cos(angle)*CONFIG.photoOrbitRadius), 0.1);
                    mesh.lookAt(camera.position);
                    mesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                    if (mesh.position.z > maxZ) { maxZ = mesh.position.z; bestIdx = i; }
                });
                selectedIndex = bestIdx;
            } else if (state === 'PHOTO') {
                photoMeshes.forEach((mesh, i) => {
                    if (i === selectedIndex) {
                        mesh.position.lerp(new THREE.Vector3(0, 0, 70), 0.1);
                        mesh.scale.lerp(new THREE.Vector3(4, 4, 4), 0.1);
                        mesh.lookAt(camera.position);
                        mesh.rotation.z = 0;
                    } else { mesh.scale.lerp(new THREE.Vector3(0, 0, 0), 0.1); }
                });
            }
            renderer.render(scene, camera);
        }

        function startSystem() {
            const btn = document.getElementById('btnStart');
            btn.innerText = "ĐANG XỬ LÝ...";
            
            loadLogoAndInit(() => {
                btn.style.display = 'none';
                document.getElementById('guideText').style.visibility = 'visible';
                bgMusic.play().catch(e => console.log("Music blocked"));
                init3D();
                startCamera();
            });
        }

        function startCamera() {
            const video = document.getElementsByClassName('input_video')[0];
            const canvas = document.getElementById('camera-preview');
            const ctx = canvas.getContext('2d');
            const statusDiv = document.getElementById('status');
            const guideDiv = document.getElementById('guideText');

            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

            hands.onResults(results => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

                if (results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    handX = lm[9].x;
                    const wrist = lm[0];
                    const tips = [8, 12, 16, 20];
                    let openDist = 0;
                    tips.forEach(i => openDist += Math.hypot(lm[i].x - wrist.x, lm[i].y - wrist.y));
                    
                    statusDiv.style.visibility = "hidden";
                    guideDiv.style.visibility = "hidden";
                    
                    if ((openDist / 4) < 0.25) {
                        state = 'SHAPE';

                        statusDiv.style.visibility = "visible";
                        guideDiv.style.visibility = "visible";

                    } else if (Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y) < 0.05) {
                        state = 'PHOTO';

                    } else {
                        state = 'EXPLODE';
                    }
                } else { state = 'SHAPE'; }
            });

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 320, height: 240
            });
            cameraUtils.start();
        }

        window.addEventListener('resize', () => {
            if (camera) { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });
    </script>
</body>
</html>
